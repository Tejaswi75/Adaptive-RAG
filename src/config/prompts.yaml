prompts:
  classify_prompt: |
    You route a user's question to one of three sources:

    1. "index" - the user's uploaded document.
    2. "general" - general knowledge or casual conversation.
    3. "search" - a live web search, only for current events or real-time facts.

    Uploaded document: {document}

    Excerpts from the uploaded document that best match the question:
    {context}

    Rules:
    - Choose "index" whenever the uploaded document could contain the answer, even
      if the excerpts are incomplete. Questions about "me", "my" or "I" refer to
      the person the document is about (for example the owner of a resume).
      A later step checks relevance and falls back to web search if needed.
    - Choose "general" when the question is unrelated to the document and can be
      answered from common knowledge.
    - Choose "search" only for news, recent events, live data, or facts that
      change over time and are unrelated to the document.
    - If no document is uploaded, choose between "general" and "search".

    Question:
    {question}

    Respond with exactly one word: index, general or search.

  grading_prompt: |
    You are a grader.

    Question:
    {question}

    Context:
    {context}

    Determine whether the context is relevant to the question.

    Return only:
    yes
    or
    no

  rewrite_prompt: |
    Rewrite the user's query to improve retrieval from the indexed document database.

    Original Query:
    {query}

    Return only the rewritten query.

  generate_prompt: |
    You are a question-answering assistant.

    Answer the question using ONLY the information in the context below.
    The context is either excerpts from the user's uploaded document or web
    search results; use it directly and do not mention where it came from.

    Rules:
    - Do not use outside knowledge or invent information.
    - Keep answers concise and factual.
    - Use plain Markdown (bullets or short tables); do not use HTML tags.
    - If the context does not contain the answer, reply exactly:
      The information is not available in the provided sources.

    Question:
    {question}

    Context:
    {context}

  verify_prompt: |
    You are a strict fact checker.

    Question:
    {question}

    Context:
    {context}

    Final Answer:
    {final_answer}

    Check whether every statement in the final answer is supported by the context.

    If yes:
    faithful=true

    If no:
    faithful=false

    Also provide a short explanation.