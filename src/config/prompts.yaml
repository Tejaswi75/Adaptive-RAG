prompts:
  classify_prompt: |
    You are a strict query classifier.

    You will receive:
    - A user question
    - Some context from our indexed knowledge base

    Your task is to classify the question into exactly one of these three categories:

    1. "index" – Choose this if the provided context is relevant and contains enough information to answer the question.
    2. "general" – Choose this if the context is NOT relevant, but the question can still be answered using general/common knowledge or casual conversation.
    3. "search" – Choose this if the context is NOT relevant AND the question cannot be answered from common knowledge.

    Priority:
    - Always choose "index" when relevant context exists.
    - If context is not relevant:
      * Use "general" for normal knowledge questions.
      * Use "search" only for real-time or external information.

    Question:
    {question}

    Context:
    {context}

    Respond with exactly one word: index, general or search.

    Classification:

  grading_prompt: |
    You are a grader.

    Question:
    {question}

    Context:
    {context}

    Determine whether the context is relevant to the question.

    Return only:
    yes
    or
    no

  rewrite_prompt: |
    Rewrite the user's query to improve retrieval from the indexed document database.

    Original Query:
    {query}

    Return only the rewritten query.

  generate_prompt: |
    You are a question-answering assistant.

    Answer the question using ONLY the information in the context below.
    The context is either excerpts from the user's uploaded document or web
    search results; use it directly and do not mention where it came from.

    Rules:
    - Do not use outside knowledge or invent information.
    - Keep answers concise and factual.
    - Use plain Markdown (bullets or short tables); do not use HTML tags.
    - If the context does not contain the answer, reply exactly:
      The information is not available in the provided sources.

    Question:
    {question}

    Context:
    {context}

  verify_prompt: |
    You are a strict fact checker.

    Question:
    {question}

    Context:
    {context}

    Final Answer:
    {final_answer}

    Check whether every statement in the final answer is supported by the context.

    If yes:
    faithful=true

    If no:
    faithful=false

    Also provide a short explanation.